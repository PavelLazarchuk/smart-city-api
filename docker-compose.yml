services:
    api:
        build:
            context: .
            target: dev
        env_file: .env
        environment:
            NODE_ENV: development
            MAIL_PROVIDER: smtp
            SMTP_HOST: mailhog
            SMTP_PORT: 1025
            SMTP_SECURE: 'false'
        ports:
            - '8080:8080'
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            mailhog:
                condition: service_started
            mongo:
                condition: service_healthy
                required: false

    mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
            - '1025:1025'
            - '8025:8025'

    # Optional local database: `docker compose --profile local-db up`.
    mongo:
        image: mongo:8.2
        profiles: ['local-db']
        command: ['--replSet', 'rs0', '--bind_ip_all']
        ports:
            - '27017:27017'
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }).ok }" | grep -q 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

volumes:
    mongo-data:
